name: TAMUR Weather Bot Production Lock

on:
  push:
    branches:
      - claude/tamur-weather-bot-ow96wt
    paths:
      - 'tamur-weather-bot/**'
      - '.github/workflows/tamur-weather-bot-ci.yml'
  pull_request:
    paths:
      - 'tamur-weather-bot/**'
      - '.github/workflows/tamur-weather-bot-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tamur-weather-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tamur-weather-bot/package-lock.json

      - name: Clean install
        run: npm ci

      - name: Locked build (typecheck + tests + compile)
        run: npm run build
